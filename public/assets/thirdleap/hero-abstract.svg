<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <title id="title">Third Leap Labs intelligent systems</title>
  <desc id="desc">Abstract connected system representing AI, computer vision, Web3 and open engineering.</desc>
  <defs>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0078D4" stop-opacity=".08"/>
      <stop offset=".28" stop-color="#00A4EF" stop-opacity=".62"/>
      <stop offset=".58" stop-color="#8B5CF6" stop-opacity=".55"/>
      <stop offset="1" stop-color="#F25022" stop-opacity=".14"/>
    </linearGradient>
    <linearGradient id="platform" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#E8F5FF"/>
      <stop offset=".55" stop-color="#DDEBFF"/>
      <stop offset="1" stop-color="#F2EAFE"/>
    </linearGradient>
    <radialGradient id="lens" cx="48%" cy="42%" r="55%">
      <stop offset="0" stop-color="#EAF8FF"/>
      <stop offset=".18" stop-color="#38BDF8"/>
      <stop offset=".46" stop-color="#0078D4"/>
      <stop offset=".72" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#07111F"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#44617D" flood-opacity=".18"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

